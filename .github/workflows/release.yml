name: Release

# Builds the signed release APK + AAB, publishes a GitHub Release (APK, for
# sideloading), mirrors the APK onto the website as the stable "latest APK"
# download, and uploads the AAB to Google Play (Play only accepts AABs).
#
# Download links used by the website/README:
#   https://pevplugshare.a42r.com/download/PEVPlugShare.apk      (public, always latest)
#   https://github.com/githuba42r/PEVPlugShare/releases/latest/download/PEVPlugShare-latest.apk
#     (stable per-release alias asset; needs repo access — the repo is private)
#
# Triggers:
#   - push of a tag matching v* (normal flow: ./release.sh && git push --tags)
#   - manual dispatch, optionally with an existing tag to (re)release
#
# Required repository secrets:
#   ANDROID_KEYSTORE_B64           base64 of pevplugshare-release.jks
#   ANDROID_KEYSTORE_PASSWORD      keystore password
#   ANDROID_KEY_ALIAS              key alias
#   ANDROID_KEY_PASSWORD           key password
#   APP_SECRETS_PROPERTIES_B64     base64 of secrets.properties (OAuth secrets)
#
# Google Play upload (skipped with a warning when the secret is absent):
#   PLAY_SERVICE_ACCOUNT_JSON      contents of play-service-account.json
# Optional repository variables:
#   PLAY_TRACK                     internal (default) | alpha | beta | production
#   PLAY_RELEASE_STATUS            completed (default) | draft — use draft until
#                                  the app has been published once in Play Console
#
# Website APK publish (skipped with a warning when WEBSITE_DEPLOY_* is absent):
#   WEBSITE_DEPLOY_HOST / WEBSITE_DEPLOY_USER / WEBSITE_DEPLOY_SSH_KEY /
#   WEBSITE_DEPLOY_KNOWN_HOSTS     same key used by deploy-website.yml
#   WEBSITE_DEPLOY_PATH            variable; defaults to /opt/apps/pevplugshare/website
# Cloudflare cache purge of the APK URL (skipped when absent):
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build & release (e.g. v1.3.0). Leave empty to build without publishing."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release secrets are configured
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_SECRETS_B64: ${{ secrets.APP_SECRETS_PROPERTIES_B64 }}
        run: |
          missing=""
          if [ -z "$KS_B64" ]; then missing="$missing ANDROID_KEYSTORE_B64"; fi
          if [ -z "$KS_PASS" ]; then missing="$missing ANDROID_KEYSTORE_PASSWORD"; fi
          if [ -z "$KEY_ALIAS" ]; then missing="$missing ANDROID_KEY_ALIAS"; fi
          if [ -z "$KEY_PASS" ]; then missing="$missing ANDROID_KEY_PASSWORD"; fi
          if [ -z "$APP_SECRETS_B64" ]; then missing="$missing APP_SECRETS_PROPERTIES_B64"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing"
            exit 1
          fi

      - name: Restore signing material
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_SECRETS_B64: ${{ secrets.APP_SECRETS_PROPERTIES_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > pevplugshare-release.jks
          echo "$APP_SECRETS_B64" | base64 -d > secrets.properties
          printf 'storeFile=pevplugshare-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties

      - name: Build release APK and AAB
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect artifacts
        run: |
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::Signed APK not found — output was unsigned (signing config not applied?)"
            find app/build/outputs -type f -name '*.apk' -o -name '*.aab' || true
            exit 1
          fi
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "::error::APK build produced an unsigned artifact"
            exit 1
          fi
          if [ ! -f app/build/outputs/bundle/release/app-release.aab ]; then
            echo "::error::Release AAB not found"
            exit 1
          fi
          TAG="${RELEASE_TAG:-build}"
          mkdir -p dist play
          cp app/build/outputs/apk/release/app-release.apk "dist/PEVPlugShare-${TAG}.apk"
          # Stable alias so releases/latest/download/<asset> is a fixed URL
          cp app/build/outputs/apk/release/app-release.apk dist/PEVPlugShare-latest.apk
          # AAB kept out of dist/ so it isn't attached to the GitHub release
          cp app/build/outputs/bundle/release/app-release.aab "play/PEVPlugShare-${TAG}.aab"
          ls -l dist/ play/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pevplugshare-${{ env.RELEASE_TAG || 'build' }}
          path: |
            dist/
            play/

      - name: Create GitHub release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --generate-notes --verify-tag
          fi
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish APK to website
        if: env.RELEASE_TAG != ''
        env:
          HOST: ${{ secrets.WEBSITE_DEPLOY_HOST }}
          USER: ${{ secrets.WEBSITE_DEPLOY_USER }}
          KEY: ${{ secrets.WEBSITE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WEBSITE_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.WEBSITE_DEPLOY_PATH || '/opt/apps/pevplugshare/website' }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::warning::WEBSITE_DEPLOY_* secrets not set — skipping website APK publish"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          REMOTE_DIR="$DEPLOY_PATH/download"
          APK_URL="https://pevplugshare.a42r.com/download/PEVPlugShare.apk"

          # The deploy key is restricted to rsync (/usr/bin/rrsync forced
          # command), so ssh/scp are rejected — publish over rsync only.
          # The payload is seeded from the repo's download/ dir (holds the
          # .gitkeep that lets the website mirror create the directory) with the
          # APK renamed to its public name; deploy-website.yml excludes only
          # download/PEVPlugShare.apk, so the mirror never deletes the release
          # copy. rsync stages a temp file and renames, so visitors never fetch
          # a half-written APK.
          mkdir -p dist/site website/download
          cp -a website/download/. dist/site/
          cp dist/PEVPlugShare-latest.apk dist/site/PEVPlugShare.apk
          rsync -rlvz -e "ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/site/ "$USER@$HOST:$REMOTE_DIR/"
          echo "Published $REMOTE_DIR/PEVPlugShare.apk"

          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ZONE" ]; then
            resp=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data "$(jq -n --arg f "$APK_URL" '{files: [$f]}')")
            if [ "$(echo "$resp" | jq -r .success)" != "true" ]; then
              echo "::warning::Cloudflare purge failed: $(echo "$resp" | jq -c .errors)"
            fi
          fi

          # The purge is async — retry until the public file matches the build
          verified=""
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS -o "$RUNNER_TEMP/remote.apk" "$APK_URL" \
               && cmp -s dist/PEVPlugShare-latest.apk "$RUNNER_TEMP/remote.apk"; then
              verified=1
              break
            fi
            echo "attempt $attempt: $APK_URL not matching yet — retrying in 10s"
            sleep 10
          done
          if [ -z "$verified" ]; then
            echo "::error::$APK_URL does not match the APK just built"
            exit 1
          fi
          echo "Verified $APK_URL ($(stat -c%s dist/PEVPlugShare-latest.apk) bytes)"

      - name: Generate Play release notes
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # whatsNewDirectory requires files named whatsnew-<BCP47-locale>.
          # Checkout is shallow (repo is ~1.4 GiB), so take the auto-generated
          # GitHub release notes instead of a local git log.
          mkdir -p dist/whatsnew
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body \
            | grep -vE '^[[:space:]]*#|^[[:space:]]*\*\*Full Changelog' \
            | sed 's/[[:space:]]*$//' | awk 'NF' \
            | head -c 500 > dist/whatsnew/whatsnew-en-US
          if [ ! -s dist/whatsnew/whatsnew-en-US ]; then
            printf 'New in %s' "$RELEASE_TAG" > dist/whatsnew/whatsnew-en-US
          fi
          echo "whatsnew-en-US:"
          cat dist/whatsnew/whatsnew-en-US

      - name: Check Play upload credentials
        id: play
        if: env.RELEASE_TAG != ''
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON not set — skipping Google Play upload"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB to Google Play
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.a42r.pevplugshare
          releaseFiles: play/*.aab
          releaseName: ${{ env.RELEASE_TAG }}
          tracks: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: dist/whatsnew
