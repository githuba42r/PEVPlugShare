events {
    worker_connections 1024;
}

http {
    upstream lambda_register {
        server lambda-register:8080;
    }

    upstream lambda_callback {
        server lambda-callback:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Register endpoint
        location /oauth/register {
            proxy_pass http://lambda_register/2015-03-31/functions/function/invocations;
            proxy_set_header Content-Type application/json;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Callback endpoint
        location ~ ^/oauth/callback/(.+)$ {
            proxy_pass http://lambda_callback/2015-03-31/functions/function/invocations;
            proxy_set_header Content-Type application/json;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
