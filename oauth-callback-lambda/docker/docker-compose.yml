version: '3.8'

services:
  # LocalStack for local AWS services
  localstack:
    image: localstack/localstack:latest
    container_name: oauth-localstack
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      - SERVICES=dynamodb,lambda,apigateway,iam,logs
      - DEBUG=1
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DATA_DIR=/tmp/localstack/data
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack-data:/tmp/localstack/data"
    networks:
      - oauth-network

  # DynamoDB Admin UI
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: oauth-dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      - localstack
    networks:
      - oauth-network

  # Lambda function - Register
  lambda-register:
    build:
      context: ..
      dockerfile: docker/Dockerfile.register
    container_name: oauth-lambda-register
    ports:
      - "9000:8080"
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DYNAMODB_TABLE=oauth-sessions
      - DOMAIN_NAME=http://localhost:3000
      - SESSION_TTL_MINUTES=10
      - OAUTH_PROVIDERS=openrouter,github,google
      - SHARED_SECRET=test-secret-change-in-production
      - AWS_LAMBDA_FUNCTION_NAME=oauth-callback-register
    depends_on:
      - localstack
    networks:
      - oauth-network

  # Lambda function - Callback
  lambda-callback:
    build:
      context: ..
      dockerfile: docker/Dockerfile.callback
    container_name: oauth-lambda-callback
    ports:
      - "9001:8080"
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DYNAMODB_TABLE=oauth-sessions
      - DEEP_LINK_SCHEME=pevplugshare://oauth/callback
      - AWS_LAMBDA_FUNCTION_NAME=oauth-callback-callback
    depends_on:
      - localstack
    networks:
      - oauth-network

  # Simple API Gateway proxy for local testing
  api-gateway:
    image: nginx:alpine
    container_name: oauth-api-gateway
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - lambda-register
      - lambda-callback
    networks:
      - oauth-network

networks:
  oauth-network:
    driver: bridge

volumes:
  localstack-data:
